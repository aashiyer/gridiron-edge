name: Gridiron Edge data ticks

# Runs ingestion jobs directly on the GitHub Actions runner against
# Postgres (Supabase) — not routed through the deployed backend.
# GitHub-hosted runners get ~7GB RAM and their own IP per job.
#
# Requires one repo secret (same value already set on the backend):
#   DATABASE_URL   Supabase's pooled ("Transaction pooler", port 6543)
#                  connection string
on:
  schedule:
    - cron: "*/15 * * * *"   # odds + auto-grade
    - cron: "0 * * * *"      # full-season schedule/odds sweep
    - cron: "0 */6 * * *"    # FPI ratings
    - cron: "0 */2 * * *"    # depth charts / injuries
    - cron: "5 */2 * * *"    # recent-season EPA/play efficiency stats (offset
                             # 5min, before recs so recs reads fresh team_stats)
    - cron: "8 */2 * * *"    # recent-season NextGen Stats (offset 8min, before
                             # recs so recs reads fresh ngs_team_stats)
    - cron: "10 */2 * * *"   # weather forecasts (offset 10min, after depth,
                             # before recs so recs reads fresh temp/wind)
    - cron: "15 */2 * * *"   # recent-season QB usage (offset 15min, before
                             # recs so recs reads fresh career-start counts)
    - cron: "20 */2 * * *"   # precompute recommendations (offset 20min so it
                             # runs *after* the depth-chart/weather/qb_starters
                             # refreshes it reads)
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run manually"
        required: true
        type: choice
        options: [odds, season, fpi, depth, weather, qb_starters, pbp_stats, ngs_stats, recs]

jobs:
  tick:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Determine job from schedule
        id: job
        run: |
          if [ -n "${{ github.event.inputs.job }}" ]; then
            echo "name=${{ github.event.inputs.job }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${{ github.event.schedule }}" in
            "*/15 * * * *") echo "name=odds" >> "$GITHUB_OUTPUT" ;;
            "0 * * * *") echo "name=season" >> "$GITHUB_OUTPUT" ;;
            "0 */6 * * *") echo "name=fpi" >> "$GITHUB_OUTPUT" ;;
            "0 */2 * * *") echo "name=depth" >> "$GITHUB_OUTPUT" ;;
            "5 */2 * * *") echo "name=pbp_stats" >> "$GITHUB_OUTPUT" ;;
            "8 */2 * * *") echo "name=ngs_stats" >> "$GITHUB_OUTPUT" ;;
            "10 */2 * * *") echo "name=weather" >> "$GITHUB_OUTPUT" ;;
            "15 */2 * * *") echo "name=qb_starters" >> "$GITHUB_OUTPUT" ;;
            "20 */2 * * *") echo "name=recs" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Require Postgres secret
        run: |
          # DATABASE_URL empty (unset secret) makes backend/database.py
          # silently fall back to a local sqlite file on this ephemeral
          # runner — no error, just a write that vanishes when the job ends
          # and never reaches the real database. Fail loudly instead.
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::error::DATABASE_URL repo secret is not set — see this workflow's header comment."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tick
        run: python -m ingestion.tick --job ${{ steps.job.outputs.name }}
